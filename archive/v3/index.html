<head>

  <!-- JSON-LD -->
  <script type="application/ld+json">

  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&family=Noto+Sans+TC:wght@400;500;700&display=swap" rel="stylesheet" />

  <style>
    /* ============ Industrial / Academic tokens — LIGHT (Swiss print) ============ */
    :root, [data-theme="light"] {
      --bg:        #F4F4F0;
      --surface:   #ECEAE3;
      --surface-2: #E2E0D7;
      --ink:       #131210;
      --muted:     #56534B;
      --line:      #CBC8BD;
      --line-2:    #131210;
      --accent:    #E61919;
      --accent-ink:#FFFFFF;
      --ok:        #1f7a3d;
      --grid-dot:  rgba(19,18,16,.05);
    }
    /* ============ Tactical telemetry — DARK ============ */
    [data-theme="dark"] {
      --bg:        #0D0D0C;
      --surface:   #161614;
      --surface-2: #1E1E1B;
      --ink:       #ECEAE3;
      --muted:     #989489;
      --line:      #2A2A26;
      --line-2:    #ECEAE3;
      --accent:    #FF2A2A;
      --accent-ink:#0D0D0C;
      --ok:        #4AF626;
      --grid-dot:  rgba(236,234,227,.05);
    }

    * { box-sizing: border-box; }
    html { scroll-behavior: smooth; }
    body {
      margin: 0;
      font-family: "Archivo", "Noto Sans TC", system-ui, sans-serif;
      background: var(--bg);
      color: var(--ink);
      -webkit-font-smoothing: antialiased;
      transition: background .2s, color .2s;
      background-image: radial-gradient(var(--grid-dot) 1px, transparent 1px);
      background-size: 22px 22px;
    }
    a { color: inherit; text-decoration: none; }
    .mono { font-family: "IBM Plex Mono", ui-monospace, monospace; }
    .up   { text-transform: uppercase; letter-spacing: .08em; }

    /* ---------- App bar ---------- */
    .appbar {
      position: sticky; top: 0; z-index: 40;
      background: var(--bg);
      border-bottom: 2px solid var(--line-2);
    }
    .appbar__inner {
      max-width: 1180px; margin: 0 auto; padding: 12px 20px;
      display: flex; align-items: center; gap: 14px;
    }
    .brand { display: flex; align-items: baseline; gap: 10px; min-width: 0; }
    .brand__mark {
      font-family: "Archivo"; font-weight: 900; font-size: 1.25rem;
      letter-spacing: -.03em; color: var(--ink);
    }
    .brand__mark b { color: var(--accent); }
    .brand__sub {
      font-family: "IBM Plex Mono", monospace; font-size: .66rem;
      text-transform: uppercase; letter-spacing: .12em; color: var(--muted);
      white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .appbar__actions { margin-left: auto; display: flex; gap: 0; flex: 0 0 auto;
      border: 1px solid var(--line-2); }
    .iconbtn {
      display: inline-flex; align-items: center; gap: 5px;
      border: none; background: transparent; color: var(--ink);
      padding: 7px 11px; cursor: pointer;
      font-family: "IBM Plex Mono", monospace; font-size: .72rem;
      text-transform: uppercase; letter-spacing: .08em;
    }
    .iconbtn + .iconbtn { border-left: 1px solid var(--line-2); }
    .iconbtn:hover { background: var(--ink); color: var(--bg); }

    /* ---------- Hero ---------- */
    .hero {
      max-width: 1180px; margin: 0 auto; padding: 40px 20px 28px;
      border-bottom: 1px solid var(--line);
    }
    .hero__kicker {
      font-family: "IBM Plex Mono", monospace; font-size: .72rem;
      text-transform: uppercase; letter-spacing: .16em; color: var(--accent);
      margin: 0 0 14px;
    }
    .hero__title {
      font-family: "Archivo"; font-weight: 900;
      font-size: clamp(2.1rem, 7vw, 5.2rem); line-height: .92;
      letter-spacing: -.035em; margin: 0; text-transform: uppercase;
    }
    .hero__meta {
      margin: 22px 0 0; display: grid; gap: 1px;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      background: var(--line); border: 1px solid var(--line);
    }
    .fact { background: var(--bg); padding: 14px 16px; }
    .fact__k {
      font-family: "IBM Plex Mono", monospace; font-size: .64rem;
      text-transform: uppercase; letter-spacing: .12em; color: var(--muted); margin: 0;
    }
    .fact__v { margin: 6px 0 0; font-weight: 700; font-size: .98rem; line-height: 1.25; }
    .hero__lead { margin: 22px 0 0; max-width: 60ch; color: var(--muted); line-height: 1.65; font-size: .98rem; }
    .hero__links { margin: 20px 0 0; display: flex; flex-wrap: wrap; gap: 8px; }
    .linkpill {
      display: inline-flex; align-items: center; gap: 6px;
      border: 1px solid var(--line-2); padding: 7px 12px;
      font-family: "IBM Plex Mono", monospace; font-size: .72rem;
      text-transform: uppercase; letter-spacing: .06em; cursor: pointer;
    }
    .linkpill:hover { background: var(--ink); color: var(--bg); }
    .linkpill::after { content: "↗"; font-size: .8em; opacity: .6; }

    /* ---------- Section nav ---------- */
    .nav {
      position: sticky; top: 53px; z-index: 30;
      background: var(--bg); border-bottom: 2px solid var(--line-2);
    }
    .nav__inner {
      max-width: 1180px; margin: 0 auto; padding: 0 20px;
      display: flex; gap: 0; overflow-x: auto; -webkit-overflow-scrolling: touch;
    }
    .nav a {
      flex: 0 0 auto; padding: 12px 14px;
      font-family: "IBM Plex Mono", monospace; font-size: .72rem;
      text-transform: uppercase; letter-spacing: .08em; color: var(--muted);
      border-bottom: 2px solid transparent; margin-bottom: -2px; white-space: nowrap;
    }
    .nav a:hover { color: var(--ink); }
    .nav a.active { color: var(--ink); border-bottom-color: var(--accent); }

    /* ---------- Search ---------- */
    .searchbar { max-width: 1180px; margin: 0 auto; padding: 18px 20px 4px; }
    .search {
      display: flex; align-items: center; gap: 10px;
      border: 1px solid var(--line-2); padding: 0 14px; background: var(--surface);
    }
    .search input {
      flex: 1; border: none; background: transparent; color: var(--ink);
      font-family: "IBM Plex Mono", monospace; font-size: .9rem; padding: 13px 0; outline: none;
    }
    .search .glyph { color: var(--muted); font-family: "IBM Plex Mono", monospace; }
    .search__count {
      font-family: "IBM Plex Mono", monospace; font-size: .7rem; color: var(--muted);
      white-space: nowrap;
    }

    /* ---------- Generic section ---------- */
    .section { max-width: 1180px; margin: 0 auto; padding: 40px 20px; scroll-margin-top: 104px; }
    .section[hidden] { display: none; }
    .sec-head { display: flex; align-items: baseline; gap: 12px; border-bottom: 2px solid var(--line-2); padding-bottom: 10px; margin-bottom: 24px; flex-wrap: wrap; }
    .sec-num { font-family: "IBM Plex Mono", monospace; font-size: .8rem; color: var(--accent); font-weight: 600; }
    .sec-title { font-family: "Archivo"; font-weight: 800; font-size: clamp(1.3rem, 3.4vw, 2rem); letter-spacing: -.02em; margin: 0; text-transform: uppercase; }
    .sec-note { font-family: "IBM Plex Mono", monospace; font-size: .7rem; color: var(--muted); margin-left: auto; }

    /* ---------- Timeline ---------- */
    .chips { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 26px; }
    .chip {
      border: 1px solid var(--line-2); background: transparent; color: var(--ink);
      padding: 6px 13px; cursor: pointer;
      font-family: "IBM Plex Mono", monospace; font-size: .72rem;
      text-transform: uppercase; letter-spacing: .06em;
    }
    .chip[aria-pressed="true"] { background: var(--ink); color: var(--bg); }
    .chip:hover:not([aria-pressed="true"]) { background: var(--surface-2); }

    .timeline { position: relative; }
    .tl-row {
      display: grid; grid-template-columns: 132px 1fr; gap: 0;
      border-top: 1px solid var(--line); cursor: pointer;
      transition: background .12s;
    }
    .tl-row:hover { background: var(--surface); }
    .tl-row:last-child { border-bottom: 1px solid var(--line); }
    .tl-date {
      padding: 18px 16px 18px 0; border-right: 2px solid var(--line-2);
      font-family: "IBM Plex Mono", monospace;
    }
    .tl-date .d { font-size: 1.5rem; font-weight: 600; line-height: 1; letter-spacing: -.02em; }
    .tl-date .m { font-size: .72rem; text-transform: uppercase; letter-spacing: .1em; color: var(--muted); margin-top: 4px; }
    .tl-date .y { font-size: .66rem; color: var(--muted); margin-top: 2px; }
    .tl-body { padding: 16px 4px 16px 18px; position: relative; }
    .tl-body::before {
      content: ""; position: absolute; left: -3px; top: 22px;
      width: 8px; height: 8px; background: var(--line-2);
    }
    .tl-row[data-status="now"]  .tl-body::before { background: var(--accent); }
    .tl-row[data-status="next"] .tl-body::before { background: var(--accent); box-shadow: 0 0 0 3px var(--bg), 0 0 0 4px var(--accent); }
    .tl-tags { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin-bottom: 7px; }
    .tag {
      font-family: "IBM Plex Mono", monospace; font-size: .62rem;
      text-transform: uppercase; letter-spacing: .08em;
      border: 1px solid var(--line); padding: 2px 7px; color: var(--muted);
    }
    .tag--cat { border-color: var(--line-2); color: var(--ink); }
    .status {
      font-family: "IBM Plex Mono", monospace; font-size: .62rem;
      text-transform: uppercase; letter-spacing: .08em; padding: 2px 7px;
    }
    .status--done { color: var(--muted); border: 1px solid var(--line); }
    .status--now  { background: var(--accent); color: var(--accent-ink); }
    .status--next { border: 1px solid var(--accent); color: var(--accent); }
    .status--upcoming { color: var(--muted); border: 1px dashed var(--line); }
    .tl-title { font-weight: 700; font-size: 1.08rem; margin: 0; letter-spacing: -.01em; }
    .tl-excerpt { margin: 6px 0 0; color: var(--muted); font-size: .9rem; line-height: 1.5; }
    .tl-row[data-status="done"] .tl-title { color: var(--muted); }

    /* ---------- Workshops ---------- */
    .grid {
      display: grid; gap: 1px; background: var(--line);
      border: 1px solid var(--line);
      grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    }
    .ws { background: var(--bg); padding: 18px; display: flex; flex-direction: column; gap: 8px; }
    .ws__n { font-family: "IBM Plex Mono", monospace; font-size: .68rem; color: var(--accent); }
    .ws__title { font-weight: 700; font-size: .98rem; line-height: 1.3; letter-spacing: -.01em; }
    .ws__zh { color: var(--muted); font-size: .82rem; line-height: 1.45; }
    .ws__links { margin-top: auto; padding-top: 8px; display: flex; gap: 14px; }
    .ws__links a {
      font-family: "IBM Plex Mono", monospace; font-size: .68rem;
      text-transform: uppercase; letter-spacing: .05em; color: var(--ink);
      border-bottom: 1px solid var(--accent); padding-bottom: 1px;
    }
    .ws__links a:hover { color: var(--accent); }

    /* ---------- Topics ---------- */
    .topics { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line);
      grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); }
    .topic { background: var(--bg); padding: 13px 16px; display: flex; gap: 11px; align-items: baseline; }
    .topic__n { font-family: "IBM Plex Mono", monospace; font-size: .72rem; color: var(--accent); flex: 0 0 auto; }
    .topic__t { font-size: .9rem; line-height: 1.4; }
    .topic__t .en { font-weight: 600; }
    .topic__t .zh { color: var(--muted); display: block; font-size: .82rem; margin-top: 2px; }

    /* ---------- People ---------- */
    .people { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line);
      grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); }
    .person { background: var(--bg); padding: 15px 16px; display: flex; flex-direction: column; gap: 3px; }
    .person__role { font-family: "IBM Plex Mono", monospace; font-size: .62rem; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
    .person__name { font-weight: 700; font-size: .98rem; }
    .person__name a:hover { color: var(--accent); border-bottom: 1px solid var(--accent); }
    .person__aff { color: var(--muted); font-size: .8rem; line-height: 1.35; }

    /* ---------- FAQ ---------- */
    .faq { border-top: 1px solid var(--line); }
    .qa { border-bottom: 1px solid var(--line); }
    .qa__q {
      width: 100%; text-align: left; background: transparent; border: none; cursor: pointer;
      padding: 16px 0; display: flex; gap: 14px; align-items: flex-start; color: var(--ink);
      font-family: inherit; font-size: 1rem; font-weight: 600; line-height: 1.4;
    }
    .qa__q .mk { font-family: "IBM Plex Mono", monospace; color: var(--accent); flex: 0 0 auto; font-size: .9rem; margin-top: 2px; }
    .qa__cat { display: inline-block; font-family: "IBM Plex Mono", monospace; font-size: .58rem; text-transform: uppercase; letter-spacing: .08em; color: var(--muted); border: 1px solid var(--line); padding: 1px 6px; margin-left: 8px; vertical-align: middle; }
    .qa__a { padding: 0 0 18px 30px; color: var(--muted); line-height: 1.65; font-size: .92rem; display: none; }
    .qa[aria-expanded="true"] .qa__a { display: block; }
    .qa[aria-expanded="true"] .qa__q .mk { color: var(--ink); }

    /* ---------- Guides ---------- */
    .guides { display: grid; gap: 1px; background: var(--line); border: 1px solid var(--line);
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); }
    .guide { background: var(--bg); padding: 16px; display: flex; flex-direction: column; gap: 6px; }
    .guide a.guide__t { font-weight: 700; font-size: .95rem; border-bottom: 1px solid var(--accent); align-self: flex-start; padding-bottom: 1px; }
    .guide a.guide__t:hover { color: var(--accent); }
    .guide__d { color: var(--muted); font-size: .84rem; line-height: 1.5; }

    .empty { padding: 40px 0; color: var(--muted); font-family: "IBM Plex Mono", monospace; font-size: .85rem; }
    .empty[hidden] { display: none; }

    /* ---------- Dialog ---------- */
    .dialog {
      border: 2px solid var(--line-2); background: var(--bg); color: var(--ink);
      max-width: 600px; width: calc(100% - 32px); padding: 0;
    }
    .dialog::backdrop { background: rgba(0,0,0,.62); }
    .dialog__bar {
      display: flex; align-items: center; gap: 0; border-bottom: 2px solid var(--line-2);
      position: sticky; top: 0; background: var(--bg);
    }
    .dialog__bar .iconbtn { border: none; }
    .dialog__bar .iconbtn + .iconbtn { border-left: 1px solid var(--line); }
    .dialog__spacer { flex: 1; }
    .dialog__body { padding: 24px; }
    .dialog__tags { display: flex; gap: 8px; flex-wrap: wrap; margin-bottom: 12px; }
    .dialog__date { font-family: "IBM Plex Mono", monospace; font-size: .8rem; color: var(--accent); margin: 0 0 6px; }
    .dialog__body h2 { margin: 0 0 12px; font-weight: 800; font-size: 1.4rem; letter-spacing: -.01em; line-height: 1.2; }
    .dialog__body p { color: var(--muted); line-height: 1.65; margin: 0 0 12px; }
    .dialog__links { list-style: none; padding: 0; margin: 16px 0 0; display: flex; flex-direction: column; gap: 8px; }
    .dialog__links a {
      display: inline-flex; align-items: center; gap: 6px;
      font-family: "IBM Plex Mono", monospace; font-size: .76rem;
      text-transform: uppercase; letter-spacing: .05em;
      border: 1px solid var(--line-2); padding: 8px 12px; align-self: flex-start;
    }
    .dialog__links a:hover { background: var(--ink); color: var(--bg); }
    .dialog__links a::after { content: "↗"; opacity: .6; }

    /* ---------- Footer ---------- */
    .footer { border-top: 2px solid var(--line-2); margin-top: 20px; }
    .footer__inner { max-width: 1180px; margin: 0 auto; padding: 28px 20px;
      font-family: "IBM Plex Mono", monospace; font-size: .74rem; color: var(--muted);
      display: flex; flex-wrap: wrap; gap: 12px 24px; justify-content: space-between; }
    .footer a { color: var(--ink); border-bottom: 1px solid var(--accent); }

    /* ---------- Responsive ---------- */
    @media (max-width: 640px) {
      .tl-row { grid-template-columns: 92px 1fr; }
      .tl-date .d { font-size: 1.2rem; }
      .hero__title { letter-spacing: -.02em; }
    }
  </style>
</head>
<body>
  <!-- App bar -->
  <header class="appbar">
    <div class="appbar__inner">
      <a class="brand" href="#top">
        <span class="brand__mark">COLM<b>·</b>2026</span>
        <span class="brand__sub" data-i18n="brandSub"></span>
      </a>
      <div class="appbar__actions">
        <button class="iconbtn" id="langToggle" type="button" aria-label="切換語言 / Toggle language">
          <span id="langLabel">EN</span>
        </button>
        <button class="iconbtn" id="themeToggle" type="button" aria-label="切換深淺色 / Toggle theme">
          <span id="themeLabel" class="mono">DARK</span>
        </button>
      </div>
    </div>
  </header>

  <!-- Hero -->
  <section class="hero" id="top">
    <p class="hero__kicker" data-i18n="kicker"></p>
    <h1 class="hero__title" data-i18n-html="heroTitle"></h1>
    <div class="hero__meta" id="heroMeta"></div>
    <p class="hero__lead" data-i18n="lead"></p>
    <div class="hero__links" id="heroLinks"></div>
  </section>

  <!-- Section nav -->
  <nav class="nav"><div class="nav__inner" id="nav"></div></nav>

  <!-- Search -->
  <div class="searchbar">
    <div class="search">
      <span class="glyph">/</span>
      <input id="searchInput" type="search" autocomplete="off" aria-label="搜尋 / Search" />
      <span class="search__count mono" id="searchCount"></span>
    </div>
  </div>

  <!-- Timeline -->
  <section class="section" id="sec-timeline">
    <div class="sec-head">
      <span class="sec-num">01</span>
      <h2 class="sec-title" data-i18n="s_timeline"></h2>
      <span class="sec-note" data-i18n="s_timeline_note"></span>
    </div>
    <div class="chips" id="chips" role="group"></div>
    <div class="timeline" id="timeline"></div>
    <p class="empty" id="tlEmpty" hidden></p>
  </section>

  <!-- Workshops -->
  <section class="section" id="sec-workshops">
    <div class="sec-head">
      <span class="sec-num">02</span>
      <h2 class="sec-title" data-i18n="s_workshops"></h2>
      <span class="sec-note" id="wsNote"></span>
    </div>
    <div class="grid" id="workshops"></div>
    <p class="empty" id="wsEmpty" hidden></p>
  </section>

  <!-- Topics -->
  <section class="section" id="sec-topics">
    <div class="sec-head">
      <span class="sec-num">03</span>
      <h2 class="sec-title" data-i18n="s_topics"></h2>
      <span class="sec-note" data-i18n="s_topics_note"></span>
    </div>
    <div class="topics" id="topics"></div>
    <p class="empty" id="topEmpty" hidden></p>
  </section>

  <!-- People -->
  <section class="section" id="sec-people">
    <div class="sec-head">
      <span class="sec-num">04</span>
      <h2 class="sec-title" data-i18n="s_people"></h2>
      <span class="sec-note" id="peopleNote"></span>
    </div>

      /* ---- nav ---- */
      var NAV_IDS = ["timeline","workshops","topics","people","faq","guides"];
      function renderNav() {
        $("nav").innerHTML = NAV_IDS.map(function (id) {
          return '<a href="#sec-' + id + '" data-nav="' + id + '">' + escapeHtml(ui("nav")[id]) + '</a>';
        }).join("");
      }

      /* ---- timeline ---- */
      function eventHay(e) { return [t(e.title), t(e.excerpt), t(e.body), catLabel(e.category), e.date].join(" "); }
      function renderTimeline() {
        var q = norm(state.search);
        var visible = EVENTS.filter(function (e) {
          if (state.category !== "all" && e.category !== state.category) return false;
          if (q && norm(eventHay(e)).indexOf(q) === -1) return false;
          return true;
        });
        var host = $("timeline"); host.innerHTML = "";
        visible.forEach(function (e) {
          var d = parseDate(e.date), st = statusOf(e);
          var row = document.createElement("article");
          row.className = "tl-row card"; row.dataset.status = st; row.dataset.slug = e.slug; row.dataset.item = e.slug; row.tabIndex = 0;
          var dayTxt = e.approx ? "~" : ("0" + d.getDate()).slice(-2);
          var monTxt = MONTHS[d.getMonth()];
          if (e.end) { var em = parseDate(e.end).getMonth(); if (em !== d.getMonth()) monTxt += "–" + MONTHS[em]; }
          var statusTxt = ui("status")[st];
          row.innerHTML =
            '<div class="tl-date"><div class="d">' + dayTxt + '</div>' +
              '<div class="m">' + monTxt + '</div>' +
              '<div class="y">' + d.getFullYear() + '</div></div>' +
            '<div class="tl-body">' +
              '<div class="tl-tags">' +
                '<span class="tag tag--cat">' + escapeHtml(catLabel(e.category)) + '</span>' +
                '<span class="status status--' + st + '">' + escapeHtml(statusTxt) + '</span>' +
              '</div>' +
              '<h3 class="tl-title">' + escapeHtml(t(e.title)) + '</h3>' +
              '<p class="tl-excerpt">' + escapeHtml(t(e.excerpt)) + '</p>' +
            '</div>';
          row.addEventListener("click", function () { openDialog(e.slug); });
          row.addEventListener("keydown", function (ev) { if (ev.key === "Enter" || ev.key === " ") { ev.preventDefault(); openDialog(e.slug); } });
          host.appendChild(row);
        });
        $("tlEmpty").hidden = visible.length !== 0;
        $("tlEmpty").textContent = ui("empty");
        return visible.length;
      }

      /* ---- workshops ---- */
      function renderWorkshops() {
        var q = norm(state.search);
        var vis = SITE_WORKSHOPS.filter(function (w) { return !q || norm(w.title + " " + w.zh).indexOf(q) !== -1; });
        var host = $("workshops"); host.innerHTML = "";
        vis.forEach(function (w, i) {
          var el = document.createElement("div"); el.className = "ws";
          el.innerHTML =
            '<span class="ws__n">W' + ("0" + (i + 1)).slice(-2) + '</span>' +
            '<div class="ws__title">' + escapeHtml(w.title) + '</div>' +
            '<div class="ws__zh">' + escapeHtml(w.zh) + '</div>' +
            '<div class="ws__links">' +
              '<a href="' + escapeHtml(w.site) + '" target="_blank" rel="noopener">' + (state.lang === "zh" ? "網站" : "Site") + '</a>' +
              (w.cfp ? '<a href="' + escapeHtml(w.cfp) + '" target="_blank" rel="noopener">' + (state.lang === "zh" ? "徵稿" : "CFP") + '</a>' : '') +
            '</div>';
          host.appendChild(el);
        });
        $("wsEmpty").hidden = vis.length !== 0; $("wsEmpty").textContent = ui("empty");
        $("wsNote").textContent = ui("wsCnt")(vis.length);
        return vis.length;
      }

      /* ---- topics ---- */
      function renderTopics() {
        var q = norm(state.search);
        var vis = SITE_TOPICS.filter(function (tp) { return !q || norm(tp.en + " " + tp.zh).indexOf(q) !== -1; });
        var host = $("topics"); host.innerHTML = "";
        vis.forEach(function (tp, i) {
          var el = document.createElement("div"); el.className = "topic";
          el.innerHTML =
            '<span class="topic__n">' + ("0" + (i + 1)).slice(-2) + '</span>' +
            '<div class="topic__t"><span class="en">' + escapeHtml(tp.en) + '</span>' +
              '<span class="zh">' + escapeHtml(tp.zh) + '</span></div>';
          host.appendChild(el);
        });
        $("topEmpty").hidden = vis.length !== 0; $("topEmpty").textContent = ui("empty");
        return vis.length;
      }

      /* ---- people ---- */
      function personCard(p, withRole) {
        var nameHtml = p.url ? '<a href="' + escapeHtml(p.url) + '" target="_blank" rel="noopener">' + escapeHtml(p.name) + ' ↗</a>' : escapeHtml(p.name);
        return '<div class="person">' +
          (withRole ? '<span class="person__role">' + escapeHtml(t(p.role)) + '</span>' : '') +
          '<span class="person__name">' + nameHtml + '</span>' +
          '<span class="person__aff">' + escapeHtml(t(p.aff)) + '</span></div>';
      }
      function personHay(p) { return p.name + " " + t(p.aff) + " " + (p.role ? t(p.role) : ""); }
      function renderPeople() {
        var q = norm(state.search);
        var orgs = SITE_ORGANIZERS.filter(function (p) { return !q || norm(personHay(p)).indexOf(q) !== -1; });
        var board = SITE_BOARD.filter(function (p) { return !q || norm(personHay(p)).indexOf(q) !== -1; });
        $("organizers").innerHTML = orgs.map(function (p) { return personCard(p, true); }).join("");
        $("board").innerHTML = board.map(function (p) { return personCard(p, false); }).join("");
        var total = orgs.length + board.length;
        $("pplEmpty").hidden = total !== 0; $("pplEmpty").textContent = ui("empty");
        $("peopleNote").textContent = ui("pplCnt")(total);
        return total;
      }

      /* ---- faq ---- */
      function renderFAQ() {
        var q = norm(state.search);
        var vis = SITE_FAQ.filter(function (f) { return !q || norm(t(f.q) + " " + t(f.a) + " " + t(f.cat)).indexOf(q) !== -1; });
        var host = $("faq"); host.innerHTML = "";
        vis.forEach(function (f, i) {
          var item = document.createElement("div"); item.className = "qa"; item.setAttribute("aria-expanded", "false");
          item.innerHTML =
            '<button class="qa__q" type="button">' +
              '<span class="mk mono">[' + ("0" + (i + 1)).slice(-2) + ']</span>' +
              '<span>' + escapeHtml(t(f.q)) + '<span class="qa__cat mono">' + escapeHtml(t(f.cat)) + '</span></span>' +
            '</button>' +
            '<div class="qa__a">' + escapeHtml(t(f.a)) + '</div>';
          item.querySelector(".qa__q").addEventListener("click", function () {
            item.setAttribute("aria-expanded", item.getAttribute("aria-expanded") === "true" ? "false" : "true");
          });
          host.appendChild(item);
        });
        $("faqEmpty").hidden = vis.length !== 0; $("faqEmpty").textContent = ui("empty");
        $("faqNote").textContent = ui("faqCnt")(vis.length);
        return vis.length;
      }

      /* ---- guides ---- */
      function renderGuides() {
        var q = norm(state.search);
        var vis = SITE_GUIDES.filter(function (g) { return !q || norm(t(g.t) + " " + t(g.d)).indexOf(q) !== -1; });
        var host = $("guides"); host.innerHTML = "";
        vis.forEach(function (g) {
          var el = document.createElement("div"); el.className = "guide";
          el.innerHTML =
            '<a class="guide__t" href="' + escapeHtml(g.url) + '" target="_blank" rel="noopener">' + escapeHtml(t(g.t)) + ' ↗</a>' +
            '<p class="guide__d">' + escapeHtml(t(g.d)) + '</p>';
          host.appendChild(el);
        });
        $("guideEmpty").hidden = vis.length !== 0; $("guideEmpty").textContent = ui("empty");
        return vis.length;
      }

      /* ---- chips ---- */
      function buildChips() {
        var host = $("chips"); host.innerHTML = "";
        ["all"].concat(CATS.map(function (c) { return c.key; })).forEach(function (key) {
          var b = document.createElement("button");
          b.type = "button"; b.className = "chip"; b.dataset.cat = key;
          b.textContent = key === "all" ? ui("all") : catLabel(key);
          b.setAttribute("aria-pressed", String(state.category === key));
          b.addEventListener("click", function () { state.category = key; syncChips(); render(); });
          host.appendChild(b);
        });
      }
      function syncChips() {
        [].forEach.call($("chips").children, function (b) { b.setAttribute("aria-pressed", String(b.dataset.cat === state.category)); });
      }

      /* ---- section show/hide under search ---- */
      function setSection(id, count) {
        var hasSearch = !!state.search;
        // timeline never hidden by search alone (it has its own empty state + chips)
        if (id === "timeline") { $("sec-timeline").hidden = false; return; }
        $("sec-" + id).hidden = hasSearch && count === 0;
      }

      /* ---- master render ---- */
      function render() {
        var counts = {
          timeline: renderTimeline(),
          workshops: renderWorkshops(),
          topics: renderTopics(),
          people: renderPeople(),
          faq: renderFAQ(),
          guides: renderGuides()
        };
        NAV_IDS.forEach(function (id) { setSection(id, counts[id]); });
        var total = counts.timeline + counts.workshops + counts.topics + counts.people + counts.faq + counts.guides;
        $("searchCount").textContent = state.search ? ui("cnt")(total) : "";
        // hide nav links whose section is hidden
        [].forEach.call($("nav").children, function (a) {
          var id = a.dataset.nav;
          a.style.display = $("sec-" + id).hidden ? "none" : "";
        });
      }

      /* ---- dialog ---- */
      function visibleEvents() {
        var q = norm(state.search);
        return EVENTS.filter(function (e) {
          if (state.category !== "all" && e.category !== state.category) return false;
          if (q && norm(eventHay(e)).indexOf(q) === -1) return false;
          return true;
        });
      }
      function openDialog(slug) {
        var e = EVENTS.find(function (x) { return x.slug === slug; });
        if (!e) return;
        var d = parseDate(e.date), st = statusOf(e);
        var dateStr = e.approx ? (state.lang === "zh" ? "約 " : "~") : "";
        dateStr += MONTHS[d.getMonth()] + " " + d.getDate() + ", " + d.getFullYear();
        if (e.end) { var de = parseDate(e.end); dateStr = MONTHS[d.getMonth()] + " " + d.getDate() + " – " + MONTHS[de.getMonth()] + " " + de.getDate() + ", " + de.getFullYear(); }
        var links = (e.links || []).map(function (l) {
          return '<li><a href="' + escapeHtml(l.url) + '" target="_blank" rel="noopener">' + escapeHtml(t(l.title)) + '</a></li>';
        }).join("");
        dialogBody.innerHTML =
          '<div class="dialog__tags">' +
            '<span class="tag tag--cat">' + escapeHtml(catLabel(e.category)) + '</span>' +
            '<span class="status status--' + st + '">' + escapeHtml(ui("status")[st]) + '</span>' +
          '</div>' +
          '<p class="dialog__date mono">' + escapeHtml(dateStr) + '</p>' +
          '<h2>' + escapeHtml(t(e.title)) + '</h2>' +
          '<p>' + escapeHtml(t(e.body)) + '</p>' +
          (links ? '<ul class="dialog__links">' + links + '</ul>' : '');
        if (!dialog.open) dialog.showModal();
        if (location.hash.slice(1) !== slug) { try { history.replaceState(null, "", "#" + slug); } catch (e2) {} }
      }
      function closeDialog() { if (dialog.open) dialog.close(); clearHash(); }
      function clearHash() { if (location.hash) { try { history.replaceState(null, "", location.pathname + location.search); } catch (e) {} } }
      function navBy(delta) {
        var vis = visibleEvents();
        var slug = location.hash.slice(1);
        var idx = vis.findIndex(function (e) { return e.slug === slug; });
        if (idx === -1) return;
        var next = vis[(idx + delta + vis.length) % vis.length];
        if (next) openDialog(next.slug);
      }

      /* ---- theme + lang ---- */
      function applyTheme() {
        document.documentElement.setAttribute("data-theme", state.theme);
        $("themeLabel").textContent = state.theme === "dark" ? "LIGHT" : "DARK";
        store.set("theme", state.theme);
      }
      function applyStatic() {
        document.documentElement.setAttribute("lang", state.lang === "zh" ? "zh-Hant" : "en");
        store.set("lang", state.lang);
        $("langLabel").textContent = state.lang === "en" ? "中" : "EN";
        document.title = state.lang === "zh" ? "COLM 2026 · 語言模型會議" : "COLM 2026 · Conference on Language Modeling";
        $("searchInput").placeholder = ui("search");
        [].forEach.call(document.querySelectorAll("[data-i18n],[data-i18n-html]"), function (el) {
          var html = el.hasAttribute("data-i18n-html");
          var key = el.getAttribute(html ? "data-i18n-html" : "data-i18n");
          var dict = I18N[state.lang] || I18N.en;
          if (dict[key] == null) return;
          if (html) el.innerHTML = dict[key]; else el.textContent = dict[key];
        });
      }

      /* ---- scroll spy ---- */
      function setupSpy() {
        var obs = new IntersectionObserver(function (entries) {
          entries.forEach(function (en) {
            if (en.isIntersecting) {
              var id = en.target.id.replace("sec-", "");
              [].forEach.call($("nav").children, function (a) { a.classList.toggle("active", a.dataset.nav === id); });
            }
          });
        }, { rootMargin: "-110px 0px -70% 0px" });
        NAV_IDS.forEach(function (id) { var el = $("sec-" + id); if (el) obs.observe(el); });
      }

      function wire() {
        $("searchInput").addEventListener("input", function (e) { state.search = e.target.value.trim(); render(); });
        $("themeToggle").addEventListener("click", function () { state.theme = state.theme === "dark" ? "light" : "dark"; applyTheme(); });
        $("langToggle").addEventListener("click", function () {
          state.lang = state.lang === "en" ? "zh" : "en";
          applyStatic(); renderHero(); renderNav(); buildChips(); render();
          var open = location.hash.slice(1);
          if (dialog.open && open) openDialog(open);
        });
        $("dialogClose").addEventListener("click", closeDialog);
        $("navPrev").addEventListener("click", function () { navBy(-1); });
        $("navNext").addEventListener("click", function () { navBy(1); });
        dialog.addEventListener("click", function (e) { if (e.target === dialog) closeDialog(); });
        dialog.addEventListener("close", clearHash);
        document.addEventListener("keydown", function (e) {
          if (!dialog.open) return;
          if (e.key === "ArrowRight") navBy(1); else if (e.key === "ArrowLeft") navBy(-1);
        });
        window.addEventListener("hashchange", syncFromHash);
      }
      function syncFromHash() {
        var slug = location.hash.slice(1);
        if (slug && EVENTS.some(function (e) { return e.slug === slug; })) openDialog(slug);
        else if (!slug && dialog.open) dialog.close();
      }

      function init() {
        applyTheme(); applyStatic(); renderHero(); renderNav(); buildChips(); render(); wire(); setupSpy(); syncFromHash();
      }
      if (document.readyState === "loading") document.addEventListener("DOMContentLoaded", init);
      else init();
    })();
  </script>
</body>
</html>
